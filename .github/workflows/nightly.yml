name: Nightly quality

# Регресс качества и латентности на опубликованных паках.
# - по расписанию: раз в сутки на паках последнего релиза;
# - на push в main: только когда меняется код/зависимости пути решений,
#   чтобы регрессия ловилась в день коммита, а не через сутки;
# - вручную: workflow_dispatch.
# Падение accuracy больше допуска или (при --latency fail) выход за бюджет p95
# делают job красным.
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "eval/**"
      - "training/**"
      - "requirements.txt"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/nightly.yml"
  workflow_dispatch:

permissions:
  contents: read

# Новый push отменяет предыдущий прогон: важно для push-триггера, чтобы
# очередь не копила устаревшие проверки.
concurrency:
  # Прогон по расписанию не должен отменяться push'ем (иначе релизный коммит
  # остаётся без проверки), а устаревшие push-прогоны отменять полезно.
  group: nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU-only torch: заметно легче и быстрее, чем CUDA-сборка по умолчанию.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Паки берём из последнего релиза — того же артефакта, что получают
      # пользователи. Если в релизе нет *-weights.tar.gz, шаг падает: это
      # сигнал, что публикация весов сломана.
      - name: Download published packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist checkpoints/packs
          gh release download --pattern '*-weights.tar.gz' --dir dist
          tar -xzf dist/*-weights.tar.gz -C checkpoints/packs --strip-components=1
          ls -1 checkpoints/packs

      # Модели энкодеров (gpt2) кэшируются между прогонами: ночной job не
      # должен каждый раз качать полгигабайта.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nightly-${{ runner.os }}-gpt2-v1

      # --latency fail: бюджет p95 из eval/nightly_baseline.json с множителем
      # 1.25. Бюджет взят с запасом над CPU-раннерами (шум десятки процентов),
      # поэтому ловит деградацию, а не колебания.
      - name: Quality and latency regression
        run: |
          python -m eval.nightly --suite all --device cpu --latency fail \
            --out data/nightly/report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: data/nightly/report.json
          if-no-files-found: warn
